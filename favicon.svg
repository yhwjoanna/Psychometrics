<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#821E33"/>
      <stop offset="100%" stop-color="#460B17"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="35%" stop-color="#F3D590"/>
      <stop offset="100%" stop-color="#C69C4E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#ECCB85" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- Psychometrics Symbol Ψ (Psi) + Measurement Axis -->
  <g filter="url(#shadow)">
    <!-- Central Measurement Axis -->
    <path d="M32 12.5 L32 51.5" stroke="url(#gold)" stroke-width="4.8" stroke-linecap="round"/>
    
    <!-- Harmonic Arc -->
    <path d="M15.5 22.5 C15.5 40.5, 48.5 40.5, 48.5 22.5" fill="none" stroke="url(#gold)" stroke-width="4.8" stroke-linecap="round"/>
    
    <!-- Base Pedestal -->
    <path d="M22 51.5 L42 51.5" stroke="url(#gold)" stroke-width="3.6" stroke-linecap="round"/>
    
    <!-- Insight Beacon Node -->
    <circle cx="32" cy="11.5" r="3.2" fill="#FFFFFF"/>
  </g>
</svg>